name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & ZIP Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_DIR" ]; then
            echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
            mkdir -p "$SDK_DIR/licenses" 2>/dev/null || true
            printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || true
            printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || true
          fi

      - name: Prepare Secrets and Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Materialize debug.keystore from base64 if present
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 3. Fallback: generate standard debug keystore if missing or empty
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain --no-configuration-cache 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "## ❌ Gradle Build Failed (Exit Code: $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo "### Compiler Errors:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong:|Compilation error|\* Exception is:|Caused by:" build.log -A 10 -B 2 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi
          echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: Package APK into ZIP Archive
        run: |
          mkdir -p release_package
          # Find generated debug APK safely
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi

          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release_package/StepSync-debug.apk

          cat << 'EOF' > release_package/INSTALL_INSTRUCTIONS.txt
StepSync Android Application (Debug Build)
=========================================
Installation Guide:
1. Transfer 'StepSync-debug.apk' to your Android device via USB, Google Drive, or direct download.
2. Open your device's File Manager and tap 'StepSync-debug.apk'.
3. Allow "Install from unknown sources" or "Install unknown apps" if prompted.
4. Launch StepSync and sync with Google Health Connect or Samsung Galaxy Fit3!
EOF

          cd release_package
          zip -9 -r ../StepSync-v1.0-APK.zip StepSync-debug.apk INSTALL_INSTRUCTIONS.txt
          cd ..

          ZIP_SIZE=$(ls -lh StepSync-v1.0-APK.zip | awk '{print $5}')
          echo "### 📦 ZIP Package Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive**: \`StepSync-v1.0-APK.zip\` ($ZIP_SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- **Contained APK**: \`StepSync-debug.apk\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK ZIP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepSync-v1.0-APK-ZIP
          path: StepSync-v1.0-APK.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Raw Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepSync-Debug-APK
          path: release_package/StepSync-debug.apk
          if-no-files-found: error
          retention-days: 14
