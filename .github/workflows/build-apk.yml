name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Align SDK, Dependencies and Resources
        run: |
          python3 -c '
          import re, os

          # 1. Align libs.versions.toml to stable coreKtx 1.15.0
          if os.path.isfile("gradle/libs.versions.toml"):
              with open("gradle/libs.versions.toml", "r") as f:
                  toml = f.read()
              toml = re.sub(r"coreKtx\s*=\s*[\"0-9\.]+", "coreKtx = \"1.15.0\"", toml)
              with open("gradle/libs.versions.toml", "w") as f:
                  f.write(toml)
              print("[OK] gradle/libs.versions.toml verified")

          # 2. Align app/build.gradle.kts to compileSdk 35 and targetSdk 35
          if os.path.isfile("app/build.gradle.kts"):
              with open("app/build.gradle.kts", "r") as f:
                  kts = f.read()
              kts = re.sub(r"compileSdk\s*\{[^}]*\}", "compileSdk = 35", kts)
              kts = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 35", kts)
              kts = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 35", kts)
              with open("app/build.gradle.kts", "w") as f:
                  f.write(kts)
              print("[OK] app/build.gradle.kts verified")

          # 3. Inject fallback string resources into strings.xml if missing
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.isfile(strings_path):
              with open(strings_path, "r") as f:
                  s = f.read()
              if "default_web_client_id" not in s:
                  s = s.replace("</resources>", "    <string name=\"default_web_client_id\">587849588879-tj00eop7iob5duvjcfsmg2bkpns3jcgt.apps.googleusercontent.com</string>\n</resources>")
                  with open(strings_path, "w") as f:
                      f.write(s)
                  print("[OK] Injected fallback strings into strings.xml")

          # 4. Patch R.string unresolved references in AuthManager and SocialCompetitionRepository
          auth_path = "app/src/main/java/com/example/auth/AuthManager.kt"
          if os.path.isfile(auth_path):
              with open(auth_path, "r") as f:
                  code = f.read()
              if "R.string.default_web_client_id" in code:
                  code = code.replace("context.getString(R.string.default_web_client_id)", "(\"587849588879-tj00eop7iob5duvjcfsmg2bkpns3jcgt.apps.googleusercontent.com\")")
                  with open(auth_path, "w") as f:
                      f.write(code)
                  print("[OK] Patched AuthManager.kt")

          repo_path = "app/src/main/java/com/example/data/repository/SocialCompetitionRepository.kt"
          if os.path.isfile(repo_path):
              with open(repo_path, "r") as f:
                  code = f.read()
              if "R.string.firestore_database_id" in code:
                  code = code.replace("context.getString(R.string.firestore_database_id)", "(\"(default)\")")
                  with open(repo_path, "w") as f:
                      f.write(code)
                  print("[OK] Patched SocialCompetitionRepository.kt")

          # 5. Ensure all Compose screens have items import if using items()
          if os.path.isdir("app/src/main/java"):
              for root, dirs, files in os.walk("app/src/main/java"):
                  for file in files:
                      if file.endswith(".kt"):
                          fpath = os.path.join(root, file)
                          with open(fpath, "r") as f:
                              content = f.read()
                          if "items(" in content and "import androidx.compose.foundation.lazy.items" not in content:
                              content = re.sub(
                                  r"(import androidx\.compose\.foundation\.lazy\.LazyColumn)",
                                  r"\1\nimport androidx.compose.foundation.lazy.items",
                                  content
                              )
                              with open(fpath, "w") as f:
                                  f.write(content)
                              print(f"[OK] Added items import to {file}")
          '

      - name: Prepare Secrets and Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Materialize debug.keystore
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 3. Fallback: generate standard debug keystore if missing or empty
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain > build.log 2>&1 || {
            STATUS=$?
            echo "## ❌ Gradle Build Failed (Exit Code: $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo "### Detailed Compiler Errors:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong:|Compilation error|\* Exception is:|Caused by:" build.log -A 10 -B 2 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 100 Lines of Build Log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit $STATUS
          }
          cat build.log
          echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Generated APK files:" >> $GITHUB_STEP_SUMMARY
          ls -la app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepSync-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
