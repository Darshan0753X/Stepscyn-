name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & ZIP Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Automatically accept all Android SDK licenses
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true

          # If sdkmanager exists, accept all licenses and install API 35
          SDKM=""
          if command -v sdkmanager &> /dev/null; then
            SDKM="sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKM" ]; then
            echo "Using sdkmanager at: $SDKM"
            yes | "$SDKM" --licenses 2>/dev/null || true
            yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
          fi

      - name: Prepare Secrets and Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Materialize debug.keystore using Python cross-platform base64 decoding
          python3 -c '
          import base64, os
          if os.path.isfile("debug.keystore.base64") and os.path.getsize("debug.keystore.base64") > 0:
              try:
                  with open("debug.keystore.base64", "rb") as f:
                      raw = f.read().strip()
                  data = base64.b64decode(raw)
                  with open("debug.keystore", "wb") as f:
                      f.write(data)
                  print("[OK] Decoded debug.keystore from base64")
              except Exception as e:
                  print("[WARN] Base64 decode fallback:", e)
          '

          # 3. Fallback: generate standard debug keystore if missing or empty
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          validate-wrappers: false

      - name: Build Debug APK
        run: |
          sed -i 's/\r$//' gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain --no-configuration-cache

      - name: Package APK into ZIP Archive
        run: |
          python3 -c '
          import os, sys, zipfile, glob

          apk_files = glob.glob("app/build/outputs/apk/debug/*.apk") + glob.glob("app/build/outputs/apk/*/*/*.apk")
          if not apk_files:
              print("❌ No APK found in app/build/outputs/apk/", file=sys.stderr)
              sys.exit(1)

          apk_path = apk_files[0]
          print(f"Packaging {apk_path} into StepSync release package")

          os.makedirs("release_artifacts", exist_ok=True)
          with open(apk_path, "rb") as src, open("release_artifacts/StepSync-debug.apk", "wb") as dst:
              dst.write(src.read())

          readme = """StepSync Android Application (Debug Build)
=========================================
Installation Guide:
1. Transfer "StepSync-debug.apk" to your Android phone or tablet.
2. Open your device File Manager and tap "StepSync-debug.apk" to install.
3. If prompted, allow "Install unknown apps" from Settings.
4. Open StepSync and sync your activity with Health Connect or smartwatch!
"""

          zip_path = "release_artifacts/StepSync-v1.0-APK.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("release_artifacts/StepSync-debug.apk", arcname="StepSync-debug.apk")
              z.writestr("INSTALL_INSTRUCTIONS.txt", readme)

          print("✅ Release artifacts prepared successfully:")
          for f in sorted(os.listdir("release_artifacts")):
              size = os.path.getsize(os.path.join("release_artifacts", f))
              print(f" - {f} ({size:,} bytes)")
          '

      - name: Upload Release Package (APK & ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: StepSync-Release-Package
          path: release_artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
